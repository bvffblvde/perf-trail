name: Perf

on:
  deployment_status:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  deployments: read

concurrency:
  group: perf-trail-${{ github.event.deployment.environment || github.ref }}
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: |
          npm install --global corepack@latest
          corepack enable
          pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - uses: ./
        with:
          urls: |
            ${{ vars.EXAMPLE_SITE_URL }}/
            ${{ vars.EXAMPLE_SITE_URL }}/docs
          working-directory: examples/next-app
          build-command: pnpm build
          bundle: next
          budgets: examples/next-app/perf-trail.budgets.json
          revalidate-url: ${{ vars.EXAMPLE_SITE_URL }}/api/revalidate
          revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}
          preview-comment: true
          extra-headers: '{"x-vercel-protection-bypass": "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"}'
